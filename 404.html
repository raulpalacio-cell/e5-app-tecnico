    <script>
      // GitHub Pages devolve o index neste endereço e, no fallback antigo,
      // troca a rota por ?/tecnico&dia=2026-11-16. Restaura path e query
      // antes do app ler o endereço.
      (function (l) {
        if (l.search[1] !== "/") return;
        var decoded = l.search.slice(1).split("&").map(function (s) {
          return s.replace(/~and~/g, "&");
        }).join("?");
        history.replaceState(null, "", l.pathname.replace(/\/$/, "") + decoded + l.hash);
      })(window.location);
    </script>
